# Monthly meetings. Since Jan 2026, ODC and the Portland Azure Data User Group
# run one coordinated schedule (Portland + Vancouver, in person and remote).
#
# Meetings scheduled on either group's Meetup appear on the site automatically
# (scripts/Sync-Meetup.ps1 runs on every build, including the daily one).
# Only add an entry under `upcoming` for something NOT on Meetup, or to override how
# a Meetup event is shown: an entry with the same start time replaces it.
# `date` is ISO 8601 with the Pacific offset: -07:00 (PDT) or -08:00 (PST).

upcoming:
  - date: "2026-11-07T08:00:00-08:00"
    title: "PNW Day of Data 2026 (replaces the November meeting)"
    speaker: ""
    format: "In person · WSU Vancouver"
    host: "Oregon Data Community"
    url: "day-of-data/"   # internal links: no leading slash

  - date: "2026-12-16T08:00:00-08:00"
    title: "No December meeting - enjoy the holidays!"
    speaker: ""
    format: "No meeting"
    host: "Oregon Data Community"
    url: "https://www.meetup.com/portland-azure-user-group/"   

